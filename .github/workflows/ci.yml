name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality-job:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DB_USER: test_training_center_user
      DB_PASS: test-only-password
      DB_NAME: test_training_center_db
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASS }}
          POSTGRES_DB: ${{ env.DB_NAME }}

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U test_training_center_user -d test_training_center_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Set up Python
        run: uv python install

      - name: Sync locked dependencies
        run: uv sync --locked --dev

      - name: Upgrade migrations
        run: uv run alembic upgrade head

      - name: Check migrations
        run: uv run alembic check

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      - name: Run tests
        run: uv run pytest tests

      - name: Build package
        run: uv build
